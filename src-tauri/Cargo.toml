[package]
name = "dm-koldron"
version = "0.0.7"
description = "Desktop companion for Dungeon Masters running in-person sessions"
authors = ["David Delanoye"]
license = "MPL-2.0"
edition = "2024"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name (Windows, rust-lang/cargo#8519).
name = "dm_koldron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Shrinks a campaign picture; only the formats the picture picker offers.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
